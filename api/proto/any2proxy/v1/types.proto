syntax = "proto3";

package any2proxy.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nichind/any2proxy/api/gen/any2proxy/v1;any2proxyv1";

message Node {
  string tag = 1;
  string protocol = 2;
  string server = 3;
  uint32 port = 4;
  string transport = 5;
  string account = 6;
  map<string, string> extra = 7;
}

message Source {
  string host = 1;
  string hash = 2;
  string etag = 3;
  google.protobuf.Timestamp fetched_at = 4;
}

message Warning {
  int32 line = 1;
  string message = 2;
}

message Profile {
  Source source = 1;
  repeated Node nodes = 2;
  repeated Warning warnings = 3;
}

message Endpoint {
  string node_tag = 1;
  string core = 2;
  string protocol = 3;
  string url = 4;
  string health = 5;
}

message CapabilityReport {
  repeated string mapped = 1;
  repeated string dropped = 2;
  repeated string target_supported = 3;
}
