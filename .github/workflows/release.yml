name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          rs=$(grep -m1 '^version = ' sdk/rust/Cargo.toml | cut -d'"' -f2)
          js=$(python3 -c "import json; print(json.load(open('sdk/node/package.json'))['version'])")
          echo "tag=$tag python=$py rust=$rs node=$js"
          test "$tag" = "$py"
          test "$tag" = "$rs"
          test "$tag" = "$js"

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/nichind/any2proxy/internal/version.Version=${GITHUB_REF_NAME#v}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="$ldflags" -o dist/a2p${{ matrix.ext }} ./cmd/a2p
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="$ldflags" -o dist/a2pd${{ matrix.ext }} ./cmd/a2pd
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -j ../a2p_${{ matrix.goos }}_${{ matrix.goarch }}.zip a2p.exe a2pd.exe)
          else
            tar -czf a2p_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz -C dist a2p a2pd
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: a2p-${{ matrix.goos }}-${{ matrix.goarch }}
          path: a2p_${{ matrix.goos }}_${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: checksums
        run: (cd release && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*

  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
        working-directory: sdk/python
      - run: python -m twine check dist/*
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  npm:
    needs: release
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: publish
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: sdk/node
        run: npm publish --access public

  crates:
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        working-directory: sdk/rust
        run: cargo publish
