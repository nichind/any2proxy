name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/a2p${{ matrix.ext }} ./cmd/a2p
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/a2pd${{ matrix.ext }} ./cmd/a2pd
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -j ../a2p_${{ matrix.goos }}_${{ matrix.goarch }}.zip a2p.exe a2pd.exe)
          else
            tar -czf a2p_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz -C dist a2p a2pd
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: a2p-${{ matrix.goos }}-${{ matrix.goarch }}
          path: a2p_${{ matrix.goos }}_${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: checksums
        run: (cd release && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*

  pypi:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
        working-directory: sdk/python
      - run: python -m twine check dist/*
        working-directory: sdk/python
      - run: twine upload dist/*
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}