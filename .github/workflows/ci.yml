name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.75.0"
      - name: proto lint
        run: buf lint
      - name: proto generate
        run: buf generate
      - name: proto drift
        run: git diff --exit-code
      - name: format
        run: test -z "$(gofmt -l ./cmd ./internal ./tests)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: cabi
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libany2proxy.so ./cmd/libany2proxy
      - name: cabi test
        run: python cabi/test.py dist/libany2proxy.so

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: python
        run: python -m unittest -v test_client.py
        working-directory: sdk/python
      - name: node
        run: node test.mjs
        working-directory: sdk/node
      - name: rust
        run: cargo test
        working-directory: sdk/rust

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
